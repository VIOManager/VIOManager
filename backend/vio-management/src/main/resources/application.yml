# 管理系统服务配置：本地默认值与 backend/docker-compose.yml 的容器默认值一一对应，开箱即用；
# 一切可用环境变量覆盖，生产配置不得写死在文件里（PRD §5：所有配置通过环境变量管理）。
server:
  port: 8088   # 阶段1 无网关直跑 8088；阶段2 论坛上线后由 Nginx 按路径转发
  tomcat:
    # 超限请求体也完整接收后再回 1009 JSON（默认 2MB 会在半途掐断连接，前端只见网络异常）；
    # 只吞客户端实际发送的量，客户端主动断开即结束
    max-swallow-size: -1
  compression:
    enabled: true   # gzip，PRD §5 性能要求
    mime-types: application/json,text/html,text/css,application/javascript
    # ⚠️ 冲突：SSE（text/event-stream）刻意不进压缩白名单——AI 助手流式输出会被 gzip 缓冲破坏
    min-response-size: 1KB

spring:
  application:
    name: vio-management
  servlet:
    multipart:
      # ⚠️ 刻意高于 vio.file.max-size-mb（210 > 200）：业务校验先给出 1009 业务码，
      # 这里是最后防线，超了由全局异常处理器同样转 1009
      max-file-size: 210MB
      max-request-size: 215MB
  datasource:
    # 宿主端口默认 3307：对应 compose 的 MySQL 容器映射（避开本机原生 MySQL 的 3306）
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:viomanager}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:dev-root-123}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # ⚠️ 冲突：V1 是 52 表全量基线，禁改；改表只新增 V2+ 脚本并同步 docs/db/initsql.sql（骨架方案 §0.1 三步走）
  data:
    redis:
      # 审批中心升级（插入点①② 组织树/未读红点缓存）+ 项目管理共享读缓存（PmQueryCache）共用；
      # 降级口径与 kb 完全同款——命令超时压到 1s + 代码内 30s 熔断，Redis 不可用时透明回退直查库
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:1s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}

minio:
  # 对象存储连接位：Step 8 文件服务才接入 SDK，此处先落配置约定
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:vio-minio}
  secret-key: ${MINIO_SECRET_KEY:dev-minio-123}

rocketmq:
  producer:
    # producer.group 是 starter 装配 DefaultMQProducer 的硬条件之一（与 rocketmq.name-server
    # 缺一不可）；name-server 不配置时自动配置整体不激活、零装配，本节只是备好另一半条件。
    # 开 MQ 的完整姿势：环境变量 ROCKETMQ_NAME_SERVER=localhost:9876 + vio.mq-enabled=true
    group: vio-mgmt-producer
    send-message-timeout: 3000

app:
  version: @project.version@

vio:
  jwt:
    # ⚠️ 安全：HS256 要求密钥至少 32 字节；生产必须用环境变量 JWT_SECRET 覆盖这个开发默认值（PRD §5）
    secret: ${JWT_SECRET:viomanager-local-dev-secret-key-32bytes-minimum}
    expire-hours: 2   # 阶段2 论坛只验签不查库，改密踢人靠短时效兜底（架构调整方案 §4）
  auth:
    # 免认证路径，逗号分隔；以后新增公开接口在此登记
    skip-paths: /api/health,/api/auth/login
  cors:
    # 跨域白名单：阶段 1 前后端直连（Vite dev 5174），阶段 2 Nginx 同源后置空
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174,http://127.0.0.1:5174}
  idempotent:
    # 幂等键有效期（小时）：过期后同 key 视为新请求可复用（规范 §9 待确认项的建议值 24）
    expire-hours: 24
  audit:
    # 审计总开关（排查性能问题时可一键停）；异步写库不拖慢接口，测试里用同步模式断言
    enabled: true
    async: true
  file:
    # 文件服务：桶名 / 单文件大小上限 / 扩展名白名单 / ClamAV 连接位
    # 2026-10-15 组长拍板：上限 20→200MB 支持视频（PRD §3.14 知识库内容形态含视频）
    bucket: vio-files
    max-size-mb: 200
    # 视频：mp4 通用 / mov 手机拍摄 / avi 相机 / mkv 压制 / webm 网页端
    # csv：教务课表导出为 CSV（2026-10-22 课表导入适配）
    allowed-extensions: jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx,ppt,pptx,zip,mp4,mov,avi,mkv,webm,csv
    clamav:
      host: ${CLAMAV_HOST:localhost}
      port: ${CLAMAV_PORT:3310}
  approval:
    # 审批单有效期（天）：到期未处理由定时任务转 EXPIRED（方案 §7 待确认项，建议值 7）
    expire-days: 7
  pm:
    # 项目管理共享读缓存（方案 §7.6）：只缓存用户无关的共享读；测试里关掉防事务回滚脏缓存
    cache:
      enabled: ${PM_CACHE_ENABLED:true}
      ttl-seconds: 60
  cache:
    # 插入点①组织树缓存：false=path LIKE 现查（现状行为）；true=cache-aside + TTL 10 分钟，Redis 挂了自动降级
    org-enabled: ${VIO_CACHE_ORG:false}
    # 插入点②未读红点缓存：false=两条 selectCount 现算（现状行为）；true=Redis Hash + 状态变更事件重算
    unread-enabled: ${VIO_CACHE_UNREAD:false}
  # 插入点③④（outbox 通知 + 延迟消息）：false=不装配任何 MQ Bean，过期兜底轮询照跑，系统与现状行为一致；
  # true=需同时设 ROCKETMQ_NAME_SERVER（如 localhost:9876），starter 见到该配置才激活装配
  mq-enabled: ${VIO_MQ:false}
