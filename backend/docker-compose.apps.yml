# 本地开发环境：四件套（MySQL + MinIO + ClamAV + Redis）默认启动；后端两个服务挂 app profile 按需带起。
# 生产 6 容器口径（含前端 nginx、AI 服务）属部署层，不在此文件（骨架方案 K5 结论）。
# 用法：cd backend && docker compose up -d（日常四件套，应用跑 IDEA）；
#      一键全套演示/冒烟：docker compose --profile app up -d --build
#      （8088 被 IDEA 占着时：要么先停 IDEA，要么 APP_PORT=18088 起容器版并行跑）；
#      推倒重建用 docker compose down -v（本地库重建零成本，kb 库由 mysql-init 自动建）。
name: vio-backend

services:
  mysql:
    image: mysql:8.4
    container_name: vio-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dev-root-123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-viomanager}
    # ⚠️ 冲突：binlog 必须开 ROW 格式并保留 14 天——二期 Canal/binlog 订阅的前置，
    # 去掉这些参数会导致二期订阅改造时全组返工（骨架方案 §1 本期不做 Canal 但先开 binlog）
    command:
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --server-id=1
      - --binlog-expire-logs-seconds=1209600   # 14 天
    ports:
      # 宿主端口默认 3307：避开开发者本机常驻的原生 MySQL；要改设 MYSQL_PORT
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - vio-mysql-data:/var/lib/mysql
      # 新卷首次初始化自动建 kb 独立库（老卷不会执行，见脚本内注释的手工补建命令）
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:latest
    container_name: vio-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vio-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev-minio-123}
    ports:
      - "9000:9000"   # S3 API，应用配置 MINIO_ENDPOINT 指向这里
      - "9001:9001"   # 管理控制台
    volumes:
      - vio-minio-data:/data

  clamav:
    image: clamav/clamav:latest
    container_name: vio-clamav
    ports:
      - "3310:3310"   # ClamD 协议端口，Step 8 文件服务接入

  # Redis：知识库推荐位缓存（feature/kb 合入 main 后属后端基础设施，不可用时 kb 自动降级直查库）；
  # 后续审批中心升级（组织树缓存/未读红点）复用此容器，不再另起。
  redis:
    image: redis:7-alpine
    container_name: vio-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"   # 宿主联调可直连；容器内服务用 REDIS_HOST=redis
    volumes:
      - vio-redis-data:/data

  # RocketMQ NameServer：审批中心升级引入（延迟消息替换过期轮询 + 状态变更通知旁路）。
  # 镜像用本机已有的 apache/rocketmq:5.5.0 零拉取；选 5.x 因时间轮支持任意延迟——
  # 4.x 只有 18 个固定等级且最长 2 小时，撑不住默认 7 天的审批时效。
  rocketmq-namesrv:
    image: apache/rocketmq:5.5.0
    container_name: vio-rmqnamesrv
    command: ["sh", "mqnamesrv"]
    ports:
      - "9876:9876"   # 宿主 IDEA 直连；容器内服务用服务名

  # RocketMQ Broker：单主异步刷盘（本地开发够用），挂 docker/rocketmq/broker.conf。
  # 应用侧默认不连 MQ——vio.mq-enabled=false 时 starter 不装配任何 MQ Bean，MQ 挂了不影响接口。
  rocketmq-broker:
    image: apache/rocketmq:5.5.0
    container_name: vio-rmqbroker
    command: ["sh", "mqbroker", "-n", "rocketmq-namesrv:9876", "-c", "/home/rocketmq/rocketmq-5.5.0/conf/broker.conf"]
    ports:
      - "10909:10909"   # VIP 通道（部分客户端走 listenPort-2）
      - "10911:10911"   # 主端口，宿主 Java 客户端实际连它
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.5.0/conf/broker.conf:ro
      - vio-rmqbroker-store:/home/rocketmq/rocketmq-5.5.0/store
    depends_on:
      - rocketmq-namesrv

  # 后端应用本体：镜像由 backend/Dockerfile 多阶段构建（构建层 Maven 打包，运行层仅 JRE）。
  # 刻意挂 profiles：默认 up 只起四件套，开发期应用照旧跑 IDEA 可热调；
  # 要一条命令起全套（演示/冒烟/部署演练）再 --profile app。
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vio-backend-app:dev
    container_name: vio-app
    profiles: ["app"]
    environment:
      # 容器网络内用服务名 + 容器原端口直连（MySQL 是 3306，不是宿主映射的 3307）
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-viomanager}
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dev-root-123}
      # 容器内连 Redis 用服务名（与 kb 服务一致）；漏配时默认 localhost 连不上，缓存会静默熔断降级直查库
      REDIS_HOST: redis
      VIO_CACHE_ORG: "false"
      VIO_CACHE_UNREAD: "false"
      # MinIO 凭据与上方 minio 服务共用同一套环境变量，改一处两端同步；桶由应用启动后自建
      # 端点默认指宿主原生 MinIO（本机口径，历史文件都在里面）；
      # 全容器套件（起 minio 容器）时显式设 MINIO_ENDPOINT=http://minio:9000
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://host.docker.internal:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-vio-minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-dev-minio-123}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      # 必须与下方 kb 服务同值（kb 不设此变量会走默认值，主服务签发的 token 到 kb 全 401）
      JWT_SECRET: ${JWT_SECRET:-viomanager-local-dev-secret-key-32bytes-minimum}
      TZ: Asia/Shanghai

    ports:
      # 宿主端口可用 APP_PORT 覆盖：IDEA 实例占着 8088 时 APP_PORT=18088 起容器版并行
      - "${APP_PORT:-8088}:8088"
    depends_on:
      mysql:
        condition: service_healthy   # Flyway 建表赶在库就绪前会启动失败，等健康检查过了再起
      # minio 依赖刻意去掉：本机 MinIO 是宿主原生进程（app 用 MINIO_ENDPOINT 指过去），
      # 起 minio 容器的全容器模式下端点自己指服务名，也不需要启动顺序保证
      clamav:
        condition: service_started

  # 知识库微服务（8091）：与 app 同一镜像、构建一次，command 换跑 kb.jar。
  # 独立库 viomanager_kb（新卷由 mysql-init 自动建，老卷手工补建一次）；token 由主服务签发。
  kb:
    image: vio-backend-app:dev
    container_name: vio-kb-app
    profiles: ["app"]
    command: ["kb.jar"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      KB_DATABASE: viomanager_kb
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dev-root-123}
      REDIS_HOST: redis   # 推荐位缓存；连不上自动降级直查库（短超时熔断，见 kb application.yml）
      JWT_SECRET: ${JWT_SECRET:-viomanager-local-dev-secret-key-32bytes-minimum}
      TZ: Asia/Shanghai
    ports:
      - "8091:8091"
    depends_on:
      mysql:
        condition: service_healthy   # kb 自己的 Flyway 建 kb 库三表两基座，同样要等库就绪
      redis:
        condition: service_started

volumes:
  vio-mysql-data:
  vio-minio-data:
  vio-redis-data:
  vio-rmqbroker-store:
