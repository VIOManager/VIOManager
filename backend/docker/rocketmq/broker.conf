# RocketMQ Broker 本地开发配置（由 docker-compose.apps.yml 挂载进容器）。
# 写法参考本机 tianhaishop 项目验证过的 Windows Docker 口径：
# broker 对外通告 127.0.0.1 + 端口已映射宿主 —— 管理端跑宿主 IDEA、连 localhost 即直连；
# 若未来后端进容器跑（--profile app），通告地址须改成 compose 服务名，本文件只服务宿主联调。
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
brokerIP1 = 127.0.0.1
# 本地开发放开 topic 自动创建：approval-expire / approval-status 首次发送即建，免手工建 topic
autoCreateTopicEnable = true
listenPort = 10911
